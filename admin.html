<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin Upload Soal — Study with Mbah</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pine: {
                            900: '#021024',
                            800: '#052659',
                            700: '#275384',
                            500: '#5483B3',
                            300: '#7DA0CA',
                            100: '#C1E8FF',
                            50:  '#F4FAFF',
                        },
                        jawa: {
                            gold: '#f59e0b',
                            amber: '#d97706',
                            brown: '#78350f',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-sans antialiased relative min-h-screen selection:bg-pine-500 selection:text-white">

    <canvas id="bg-canvas"></canvas>

    <header class="sticky top-0 z-50 backdrop-blur-md border-b border-pine-500/20 dark:border-pine-300/15 bg-white/85 dark:bg-pine-900/85">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-pine-500/20 flex items-center justify-center text-xl">⚙️</div>
                    <div>
                        <span class="font-extrabold text-lg text-pine-900 dark:text-pine-100">Dashboard <span class="gradient-text">Admin</span></span>
                        <span class="text-[10px] font-mono text-pine-700 dark:text-pine-300 block font-bold">Kelola Soal & Pembahasan</span>
                    </div>
                </a>

                <nav class="hidden lg:flex items-center gap-6 font-semibold text-sm text-pine-900 dark:text-pine-100">
                    <a href="index.html" class="hover:text-pine-500">Beranda</a>
                    <a href="latsol.html" class="hover:text-pine-500">📝 Bank Latsol</a>
                    <span class="text-jawa-amber dark:text-jawa-gold font-extrabold">⚙️ Admin</span>
                </nav>

                <div class="flex items-center gap-3">
                    <button id="theme-toggle" class="p-2.5 rounded-xl glass-card text-pine-900 dark:text-pine-100">
                        <svg id="theme-sun" class="w-5 h-5 hidden dark:block text-jawa-gold" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        <svg id="theme-moon" class="w-5 h-5 block dark:hidden text-pine-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    </button>
                    <a href="latsol.html" class="bg-gradient-to-r from-pine-700 to-pine-500 text-white px-4 py-2 rounded-xl text-xs font-bold">Lihat Halaman Latsol &rarr;</a>
                </div>
            </div>
        </div>
    </header>

    <main class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <div class="grid lg:grid-cols-12 gap-8">
            
            <!-- Left Column: Form Input Soal -->
            <div class="lg:col-span-7">
                <div class="glass-card rounded-3xl p-6 sm:p-8 border border-pine-500/30">
                    <div class="flex items-center justify-between mb-6 pb-4 border-b border-pine-500/20">
                        <div>
                            <h2 class="text-xl font-extrabold text-pine-900 dark:text-white">➕ Form Upload Soal Baru</h2>
                            <p class="text-xs text-pine-700 dark:text-pine-300 font-medium">Soal akan langsung tersimpan di LocalStorage & tampil di Halaman Latsol.</p>
                        </div>
                        <span class="px-3 py-1 rounded-full text-[10px] font-mono font-bold bg-pine-500/20 text-pine-900 dark:text-pine-100">MODUL ADMIN</span>
                    </div>

                    <form id="add-question-form" onsubmit="handleQuestionSubmit(event)" class="space-y-5">
                        
                        <!-- Subtes Dropdown -->
                        <div>
                            <label for="subtes" class="block text-xs font-bold uppercase text-pine-800 dark:text-pine-300 mb-1.5">Kategori Subtes</label>
                            <select id="subtes" required class="w-full bg-pine-50/50 dark:bg-pine-800/50 border border-pine-500/30 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-pine-500 text-pine-900 dark:text-white font-medium">
                                <option value="Penalaran Umum">Penalaran Umum (PU)</option>
                                <option value="Pengetahuan Kuantitatif">Pengetahuan Kuantitatif (PK)</option>
                                <option value="Pemahaman Bacaan & Menulis">Pemahaman Bacaan & Menulis (PBM)</option>
                                <option value="Pengetahuan & Pemahaman Umum">Pengetahuan & Pemahaman Umum (PPU)</option>
                                <option value="Literasi Bahasa Indonesia">Literasi Bahasa Indonesia</option>
                                <option value="Literasi Bahasa Inggris">Literasi Bahasa Inggris</option>
                                <option value="Penalaran Matematika">Penalaran Matematika (PM)</option>
                            </select>
                        </div>

                        <!-- Pertanyaan Soal -->
                        <div>
                            <label for="pertanyaan" class="block text-xs font-bold uppercase text-pine-800 dark:text-pine-300 mb-1.5">Teks Pertanyaan / Soal</label>
                            <textarea id="pertanyaan" required rows="3" placeholder="Tuliskan soal lengkap disini..." class="w-full bg-pine-50/50 dark:bg-pine-800/50 border border-pine-500/30 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-pine-500 text-pine-900 dark:text-white font-medium placeholder-pine-400"></textarea>
                        </div>

                        <!-- Pilihan Jawaban A-E -->
                        <div class="space-y-3 pt-2">
                            <label class="block text-xs font-bold uppercase text-pine-800 dark:text-pine-300">Pilihan Jawaban (A-E)</label>
                            
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-xs w-6 text-pine-700 dark:text-pine-300">A.</span>
                                <input type="text" id="opt-A" required placeholder="Jawaban A" class="w-full bg-pine-50/50 dark:bg-pine-800/50 border border-pine-500/30 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-pine-500 text-pine-900 dark:text-white font-medium">
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-xs w-6 text-pine-700 dark:text-pine-300">B.</span>
                                <input type="text" id="opt-B" required placeholder="Jawaban B" class="w-full bg-pine-50/50 dark:bg-pine-800/50 border border-pine-500/30 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-pine-500 text-pine-900 dark:text-white font-medium">
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-xs w-6 text-pine-700 dark:text-pine-300">C.</span>
                                <input type="text" id="opt-C" required placeholder="Jawaban C" class="w-full bg-pine-50/50 dark:bg-pine-800/50 border border-pine-500/30 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-pine-500 text-pine-900 dark:text-white font-medium">
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-xs w-6 text-pine-700 dark:text-pine-300">D.</span>
                                <input type="text" id="opt-D" required placeholder="Jawaban D" class="w-full bg-pine-50/50 dark:bg-pine-800/50 border border-pine-500/30 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-pine-500 text-pine-900 dark:text-white font-medium">
                            </div>
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-xs w-6 text-pine-700 dark:text-pine-300">E.</span>
                                <input type="text" id="opt-E" required placeholder="Jawaban E" class="w-full bg-pine-50/50 dark:bg-pine-800/50 border border-pine-500/30 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-pine-500 text-pine-900 dark:text-white font-medium">
                            </div>
                        </div>

                        <!-- Kunci Jawaban Benar -->
                        <div class="pt-2">
                            <label for="kunci" class="block text-xs font-bold uppercase text-pine-800 dark:text-pine-300 mb-1.5">Kunci Jawaban Benar</label>
                            <select id="kunci" required class="w-full bg-pine-50/50 dark:bg-pine-800/50 border border-pine-500/30 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-pine-500 text-pine-900 dark:text-white font-bold">
                                <option value="A">Pilihan A</option>
                                <option value="B">Pilihan B</option>
                                <option value="C">Pilihan C</option>
                                <option value="D">Pilihan D</option>
                                <option value="E">Pilihan E</option>
                            </select>
                        </div>

                        <!-- Pembahasan -->
                        <div>
                            <label for="pembahasan" class="block text-xs font-bold uppercase text-pine-800 dark:text-pine-300 mb-1.5">Penjelasan / Pembahasan Soal</label>
                            <textarea id="pembahasan" required rows="3" placeholder="Tuliskan logika dan langkah pengerjaannya..." class="w-full bg-pine-50/50 dark:bg-pine-800/50 border border-pine-500/30 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-pine-500 text-pine-900 dark:text-white font-medium placeholder-pine-400"></textarea>
                        </div>

                        <button type="submit" class="w-full bg-gradient-to-r from-pine-700 via-pine-500 to-jawa-amber text-white font-bold py-3.5 rounded-xl shadow-lg hover:shadow-xl transition-all text-sm">
                            🚀 Upload Soal ke Database
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Column: Daftar Soal Ter-upload -->
            <div class="lg:col-span-5">
                <div class="glass-card rounded-3xl p-6 sm:p-8 border border-pine-500/30">
                    <div class="flex items-center justify-between mb-6 pb-4 border-b border-pine-500/20">
                        <div>
                            <h2 class="text-xl font-extrabold text-pine-900 dark:text-white">📚 Soal Aktif (<span id="total-soal-count">0</span>)</h2>
                            <p class="text-xs text-pine-700 dark:text-pine-300 font-medium">Kelola & hapus soal yang ada.</p>
                        </div>
                        <button onclick="resetDefaultQuestions()" class="text-[10px] font-mono px-2.5 py-1 rounded bg-red-500/20 text-red-700 dark:text-red-300 border border-red-500/30 font-bold hover:bg-red-500/30">
                            🔄 Reset Bawaan
                        </button>
                    </div>

                    <div id="admin-questions-list" class="space-y-4 max-h-[600px] overflow-y-auto pr-1">
                        <!-- Questions list rendered via JS -->
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 bg-white dark:bg-pine-800 border border-pine-500 text-pine-900 dark:text-white px-5 py-3.5 rounded-xl shadow-2xl flex items-center gap-3 translate-y-20 opacity-0 transition-all duration-300">
        <span class="text-xl">✅</span>
        <span id="toast-message" class="text-xs font-bold">Berhasil!</span>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderAdminPage();
        });
    </script>
</body>
</html>
